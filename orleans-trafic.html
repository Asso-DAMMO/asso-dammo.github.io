<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trafic Orléans Métropole</title>

<link rel="stylesheet"
 href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
html,body{
    height:100%;
    margin:0
}
#map{
    height:100%
}

#panel{
    position:absolute;
    top:10px;
    left:10px;
    z-index:1000;
    background: white;
    padding:12px;
    border-radius:8px;
    box-shadow:0 2px 10px rgba(0,0,0,.2);
    font-family:sans-serif;
    width:230px;
}

input,select{
    width:100%
}
</style>
</head>

<body>

<div id="panel">

<b>Trafic Orléans</b><br><br>

<label>Année</label>

<select id="year">
<option>2026</option>
<option>2025</option>
<option>2024</option>
<option selected>2026</option>
</select>

<br><br>

<label>Recherche</label>
<input id="search" placeholder="George V">

</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const DATASET="beta-indicateurs-annuels-de-trafic-routier-aux-points-de-comptage-copie";

const map=L.map("map").setView([47.902,1.909],13);

L.tileLayer(
"https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
{attribution:"© OSM"}
).addTo(map);

let layer;

function color(tmja){

return tmja>45000?"#67000d":
tmja>30000?"#cb181d":
tmja>20000?"#ef3b2c":
tmja>10000?"#fb6a4a":
tmja>5000?"#fc9272":
"#fcbba1";

}

async function load(){
    const year=document.getElementById("year").value;

    const url=
    `https://data.orleans-metropole.fr/api/explore/v2.1/catalog/datasets/${DATASET}/records?where=annee=${year}&limit=100`;

    const data=await fetch(url).then(r=>r.json());

    if(layer)
        layer.remove();

    layer=L.layerGroup().addTo(map);

    const search=document.getElementById("search").value.toLowerCase();

    data.results.forEach(p=>{
        const name=(p.nom_point||"").toLowerCase();

        if(search && !name.includes(search))
            return;

        const tmja=p.tmja||0;

        const marker=L.circleMarker(
        [p.geometry.lat,p.geometry.lon],
        {
            radius:Math.max(5,Math.sqrt(tmja)/7),
            color:color(tmja),
            fillColor:color(tmja),
            fillOpacity:.8,
            weight:1
        }
    );

    marker.bindPopup(`
        <b>${p.nom_point}</b><br>
        Année : ${p.annee}<br>
        TMJA : ${tmja.toLocaleString()} véh/j<br>
        TMJO : ${(p.tmjo||0).toLocaleString()}<br>
        Volume annuel : ${(p.volume_annuel||0).toLocaleString()}<br>
        Pointe matin : ${p.pointe_matin||"-"} (${p.debit_pointe_matin||"-"} véh/h)<br>
        Pointe soir : ${p.pointe_soir||"-"} (${p.debit_pointe_soir||"-"} véh/h)
    `);

    marker.addTo(layer);

    });
}

document.getElementById("year").onchange=load;
document.getElementById("search").oninput=load;

load();

</script>

</body>
</html>
